[package]
name = "cosmic-control-center-applet"
version = "0.1.5"
edition = "2021"
description = "A COSMIC panel applet for Wi-Fi, Bluetooth, power profiles, DNS, volume and brightness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jjnuthuagen/cosmic-control-center-applet"
readme = "README.md"
# CI builds on latest stable; this is the floor, not the target.
rust-version = "1.85"

[dependencies]
# Pinned to the same revision as a known-good local applet. libcosmic is
# pre-1.0 and its API moves; an unpinned `git` dep will break without warning.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "ef490df50b0a05a21c494c3f75737581bf0b39d9", default-features = false, features = [
    "applet",
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    # The Select button in Settings opens the desktop's own file chooser
    # through the portal, rather than shipping a file browser of our own.
    "xdg-portal",
    # The About tab, laid out the way every other COSMIC about page is.
    "about",
] }

zbus = { version = "5", default-features = false, features = ["tokio"] }

# NetworkManager binding. This is the same crate the stock COSMIC network
# applet uses, and it is MIT -- which matters, because that applet itself is
# GPL-3.0-or-later and cannot be copied into this MIT/Apache repo. We share
# their foundation, not their code.
nmrs = "3.4.0"
futures = "0.3"
tokio = { version = "1", features = ["time", "process", "rt", "net"] }

serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"

fluent-bundle = "0.16"
unic-langid = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
# Panel applets stay resident for the whole session, so favour a small, fast
# binary over build speed. `panic = "abort"` is deliberately NOT set: parts of
# the iced/tokio stack rely on unwinding.
lto = "thin"
opt-level = 3
strip = true
codegen-units = 1
