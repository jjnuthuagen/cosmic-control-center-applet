# Control Center configuration.
#
# Copy to ~/.config/cosmic-control-center-applet/config.toml and edit.
# Every value below is the default, so an absent file behaves identically to
# this one. Unknown keys are rejected rather than ignored, so a typo shows up
# as a warning instead of silently doing nothing.

[modules]
# A module set to false is never constructed and never connects to its bus.
# Modules also hide themselves when the hardware or daemon is missing, so a
# desktop does not need to disable `battery` to avoid an empty tile — do it
# only if you have a battery and still don't want to see it.
wifi = true
bluetooth = true
battery = true
dns = true
volume = true
brightness = true
dark_mode = true
tiling = true
# Feral GameMode, shown on the power page when gamemoded is installed.
gamemode = true

[appearance]
# How strongly a tile shows that its control is on:
#   "high"   - the whole tile fills with the accent colour
#   "medium" - the tile stays neutral; the icon's base takes the accent
#   "low"    - tiles never look selected; you see what is chosen only after
#              opening a control, the way the battery tile already works
style = "high"

# What the panel button shows. Omit for the system default.
#   [appearance.icon]
#   kind = "preset"          # sliders | toggles | dials | grid
#   value = "sliders"
#
#   [appearance.icon]
#   kind = "custom"          # an icon-theme name, or an absolute path
#   value = "/home/you/icon.svg"

[dns]
# Extra providers, appended after the built-in ones.
# Format: ["Display name", "primary", "secondary", ...] — IPv4 only.
custom_providers = [
    # ["Home Pi-hole", "192.168.1.2"],
    # ["NextDNS", "45.90.28.0", "45.90.30.0"],
]
