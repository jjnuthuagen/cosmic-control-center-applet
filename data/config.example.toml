# Control Center configuration.
#
# Written by the Settings window (right-click the panel button), and safe to
# edit by hand. Every value below is the default, so an absent file behaves
# identically to this one. Unknown keys are rejected rather than ignored, so a
# typo shows up as a warning instead of silently doing nothing.

[modules]
# A control set to false here is never constructed and never connects to its
# bus. Controls also hide themselves when the hardware or service they need is
# missing, so a desktop does not need to disable `battery` to avoid an empty
# tile — turn one off only when it works and you still don't want it.
wifi               = true
bluetooth          = true
battery            = true
dns                = true
volume             = true
microphone         = true
brightness         = true
keyboard_backlight = true   # hides itself if the keyboard has no backlight
media              = true   # hides itself when no media player is running
vpn                = true   # hides itself when no VPN profiles are saved
dark_mode          = true
tiling             = true
do_not_disturb     = true
keep_awake         = true
gamemode           = true   # hides itself unless Feral GameMode is installed
charge_threshold   = true   # hides itself unless the hardware supports it

[appearance]
# How strongly a tile shows that its control is on:
#   "high"   - the whole tile fills with the accent colour
#   "medium" - the tile stays neutral; the icon's base takes the accent
#   "low"    - tiles never look selected; you see what is chosen only after
#              opening a control, the way the battery tile already works
style = "high"

# What the panel button shows. Omit for the system default.
#   [appearance.icon]
#   kind = "preset"          # sliders | toggles | dials | grid
#   value = "sliders"
#
#   [appearance.icon]
#   kind = "custom"          # an icon-theme name, or an absolute path
#   value = "/home/you/icon.svg"

[dns]
# Extra providers, appended after the built-in ones.
# Format: ["Display name", "primary", "secondary", ...] — IPv4 only.
custom_providers = [
    # ["Home Pi-hole", "192.168.1.2"],
    # ["NextDNS", "45.90.28.0", "45.90.30.0"],
]

# Tiles of your own, added after everything built in.
#
# `command` is a list, not a string, and runs directly rather than through a
# shell — so an argument containing spaces stays one argument and nothing is
# glob-expanded behind your back. If you want a pipeline, ask for one
# explicitly: command = ["sh", "-c", "foo | bar"].
#
# [[custom]]
# name = "Screenshot"
# icon = "camera-photo-symbolic"     # optional; falls back if your theme lacks it
# command = ["cosmic-screenshot", "--interactive=true"]
# detail = "Select a region"         # optional second line
