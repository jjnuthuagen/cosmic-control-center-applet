# Control Center configuration.
#
# Written by the Settings window (right-click the panel button), and safe to
# edit by hand. Every value below is the default, so an absent file behaves
# identically to this one. Unknown keys are rejected rather than ignored, so a
# typo shows up as a warning instead of silently doing nothing.

[modules]
# The grouped Wi-Fi + Bluetooth + VPN tile: a narrow stack of switches, the
# way the macOS Control Centre does it.
#
# Independent of `wifi`, `bluetooth` and `vpn` below, which each draw a
# standalone tile. Have the group, the individual tiles, both, or neither.
# Switching off `wifi` hides the standalone Wi-Fi tile; it does not empty
# the group's Wi-Fi row, and the module keeps running while either wants it.
connectivity = true
# A control set to false here is never constructed and never connects to its
# bus. Controls also hide themselves when the hardware or service they need is
# missing, so a desktop does not need to disable `battery` to avoid an empty
# tile — turn one off only when it works and you still don't want it.
wifi               = true
bluetooth          = true
battery            = true
dns                = true
volume             = true
microphone         = true
brightness         = true
keyboard_backlight = true   # hides itself if the keyboard has no backlight
media              = true   # hides itself when no media player is running
vpn                = true   # hides itself when no VPN profiles are saved
dark_mode          = true
tiling             = true
do_not_disturb     = true
keep_awake         = true
gamemode           = true   # hides itself unless Feral GameMode is installed
charge_threshold   = true   # hides itself unless the hardware supports it

[indicators]
# Small badges beside the panel button, for things worth knowing without
# opening the popup. Both are off by default: a second icon on your panel is
# your decision, not this applet's.
#
# battery_low         a red battery when the charge is at or under
#                     battery_low_percent and nothing is charging it. A
#                     charging battery is never low however few percent it is
#                     at — the number is going up.
# wifi_disconnected   a red mark when Wi-Fi drops.
# wifi_timeout        how long that mark stays: "30s", "1m", "5m", or "never"
#                     to leave it up until Wi-Fi is back. A disconnection is
#                     news for a while and clutter after that; a flat battery
#                     does not stop being true while you are not looking.
# side                "left" or "right" of the panel button.
battery_low = false
battery_low_percent = 20
wifi_disconnected = false
wifi_timeout = "1m"
side = "right"

[appearance]
# How strongly a tile shows that its control is on:
#   "high"   - the whole tile fills with the accent colour
#   "medium" - the tile stays neutral; the icon's base takes the accent
#   "low"    - tiles never look selected; you see what is chosen only after
#              opening a control, the way the battery tile already works
style = "high"

# How a tile's own surface is painted — how much of the desktop's frosted
# glass comes through it. Separate from `style`, which is about the on state.
#
#   "solid"   - a filled card. Thins when the desktop's frosted styling is
#               on, but still reads as a surface of its own.
#   "frosted" - the default. The blur comes through the tile, which stays
#               denser than the popup around it so it still reads as a tile.
#   "outline" - no fill: a faint edge only, and one unbroken sheet of frosted
#               glass across the whole popup.
#
# Frosted and outline only look different from solid when the desktop's
# frosted styling is on (Settings -> Appearance), since that is what makes
# the popup translucent in the first place.
finish = "frosted"

# The grid: what is on it, at what size, and where.
#
# One [[appearance.layout]] block per tile. `col` is a sub-column 0-3 (a
# square tile is two of them wide) and `row` counts from 0. A control can
# appear several times, at several sizes, and a gap you leave is kept — the
# grid is not re-packed around it.
#
# Arrange it from Settings (right-click the panel button, Tiles tab): drag a
# tile to move it, and it lands only where there is room — nothing else
# shifts to make way. Hover a tile for the - that removes it. Anything not on
# the grid is listed underneath; tap it to add it back.
#
#   [[appearance.layout]]
#   control = "battery"
#   shape   = "small"
#   col     = 0
#   row     = 0
#
#   [[appearance.layout]]
#   control = "battery"      # the same control again, bigger
#   shape   = "wide"
#   col     = 0
#   row     = 1
#
# Controls: connectivity, wifi, bluetooth, vpn, battery, dns, dark-mode,
# tiling, keyboard-backlight, do-not-disturb, keep-awake, volume,
# brightness, microphone.
#
# Shapes: "half" is icon-only, four to a row, with the name on hover;
# "small" is the plain square; "wide" is the full width; "tall" is two rows.
# The sliders are always wide and Connectivity is always tall.
#
# Being on the grid is what shows a control. There is no second switch to
# agree with: a control you have not placed is not drawn and its backend
# never starts. (The [modules] table above still governs the three that have
# no tile of their own — media, gamemode and charge_threshold.)
#
# Configs written before this existed used `order` and `shapes` instead.
# Those are read once, converted to the layout above, and dropped the next
# time the file is written — the grid looks exactly as it did.

# What the panel button shows. Omitted, it is the "toggles" preset below.
#
#   [appearance.icon]
#   kind = "preset"          # sliders | toggles | dials | grid
#   value = "sliders"
#
#   [appearance.icon]
#   kind = "system"          # whatever your icon theme uses for settings
#
#   [appearance.icon]
#   kind = "custom"          # an icon-theme name, or an absolute path
#   value = "/home/you/icon.svg"

[dns]
# Extra providers, appended after the built-in ones.
# Format: ["Display name", "primary", "secondary", ...] — IPv4 only.
custom_providers = [
    # ["Home Pi-hole", "192.168.1.2"],
    # ["NextDNS", "45.90.28.0", "45.90.30.0"],
]

# ---------------------------------------------------------------------------
# Your own tiles
# ---------------------------------------------------------------------------
#
# A tile that runs a command: a screenshot, a script, a VPN toggle — anything
# you would otherwise open a terminal for. They appear after everything built
# in, so adding one never moves the controls you are used to.
#
# A fresh install starts with a strip of icon-only launchers — Settings,
# Tweaks, Terminal, System Monitor, Claude, Log out, Restart, Power off — and
# only those whose program is actually installed (for a Flatpak, only if that
# app id is installed, not merely Flatpak itself). They are ordinary custom
# tiles from then on: edit, reshape or delete them like any other, and they
# are never added back once you have a config file.
#
# Log out, Restart and Power off ship with `confirm = true`, so they ask on a
# page of their own before doing anything.
#
# Copy the block below, uncomment it, and change the values. Add as many
# [[custom]] blocks as you like.
#
# Every option:
#
#   name      required  Shown on the tile.
#   command   required  The program and its arguments, as a list.
#   icon      optional  An icon name from your theme, or a path to an image.
#                       Defaults to a generic "runs a program" icon. If the
#                       name is not in your theme it falls back rather than
#                       drawing nothing.
#   detail    optional  A second line under the name. Defaults to the name.
#   confirm   optional  true asks before running it, on a page of its own.
#                       For the commands you cannot take back — logging out,
#                       rebooting, powering off. Defaults to false, so a
#                       launcher that just opens a window still opens it.
#   shape     optional  "half" draws it icon-only, four to a row, with the
#                       name on hover — usually what you want for a launcher.
#                       Defaults to "small", the plain square. "wide" and
#                       "tall" work too.
#   enabled   optional  false hides the tile without deleting it. Defaults to
#                       true. The Settings window writes this when you use the
#                       switch under "Your tiles".
#
# `command` is a list, not a string, and runs directly rather than through a
# shell — so an argument containing spaces stays one argument, and nothing is
# glob-expanded behind your back. If you want a pipeline, ask for one:
#
#   command = ["sh", "-c", "grim - | wl-copy"]
#
# A filled-out example:
#
# Custom tiles sit on the grid like any other control, as
# `control = { custom = 0 }` in [[appearance.layout]] — the number is the
# tile's position in the [[custom]] list below. Arrange them in Settings with
# everything else; they are placed for you the first time they appear.
#
# [[custom]]
# name = "Screenshot"
# command = ["cosmic-screenshot", "--interactive=true"]
# icon = "camera-photo-symbolic"
# detail = "Select a region"
# enabled = true
#
# The shortest one that works — everything else has a default:
#
# [[custom]]
# name = "Lock"
# command = ["loginctl", "lock-session"]
#
# A row of icon-only launchers:
#
# [[custom]]
# name = "Terminal"
# command = ["cosmic-term"]
# icon = "com.system76.CosmicTerm"
# shape = "half"
